name: Release

# Build and publish marudesk desktop installers and Android APK.
#
# Pushing a version tag (e.g. v0.2.0) builds the app on native runners for each
# target platform/arch and publishes the artifacts to a GitHub release that
# matches the package.json version (electron-builder creates it as a draft).
#
# A manual run (workflow_dispatch) builds the same matrix. By default it does NOT
# publish (smoke-test packaging); set the `publish` input to true to have
# electron-builder create the draft GitHub release (tagged v<version>) and upload
# the installers — useful when a git tag push is not available.
#
# Targets: macOS dmg (arm64 + x64), Windows NSIS (x64), Linux AppImage + deb
# (x64), Android APK (arm64/x86_64). In-app auto-update stays Windows-only for
# now (see electron/updater.ts); the macOS dmg is unsigned/download-and-run, the
# Linux artifacts are download-and-run, and the APK is sideload/debug-signed.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish installers to a draft GitHub release (v<version>)'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build both macOS arches on the Apple Silicon runner. The build sets
          # npmRebuild=false and node-pty ships prebuilds (selected at runtime by
          # node-gyp-build), so there is no native compilation — packaging the x64
          # dmg cross-arch from arm64 works and avoids the scarce/deprecated Intel
          # (macos-13) runner queue.
          - label: macOS (arm64 + x64)
            os: macos-14
            args: --mac dmg --arm64 --x64
          - label: Windows (x64)
            os: windows-latest
            args: --win nsis --x64
          - label: Linux (x64)
            os: ubuntu-latest
            args: --linux --x64
    defaults:
      run:
        working-directory: marudesk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marudesk/package-lock.json

      - name: Install dependencies
        run: npm ci

      # No native rebuild step: the build sets npmRebuild=false and relies on
      # node-pty's prebuilt binaries (node-gyp-build picks the Electron ABI at
      # runtime). Running `electron-builder install-app-deps` here forces a
      # from-source rebuild of optional native deps (e.g. ssh2's cpu-features,
      # which uses an Electron-42-incompatible nan) and breaks packaging.

      - name: Build renderer and main bundles
        run: npm run build

      - name: Package and publish
        # Publish on a version-tag push, or on a manual dispatch with publish=true;
        # otherwise build the matrix without touching a release.
        run: npx electron-builder ${{ matrix.args }} --publish ${{ (startsWith(github.ref, 'refs/tags/') || github.event.inputs.publish == 'true') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder reads GH_TOKEN for GitHub publishing.

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

  upload-apk:
    name: Upload APK to release
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Rename and upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.android.outputs.version }}
        run: |
          mv app-debug.apk "marudesk-${VERSION}.apk"
          gh release upload "v${VERSION}" "marudesk-${VERSION}.apk" \
            --repo "$GITHUB_REPOSITORY" --clobber
