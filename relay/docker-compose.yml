# One-command public deployment of the marudesk relay with automatic HTTPS.
#
#   1. Point a DNS A/AAAA record for $RELAY_DOMAIN at this host.
#   2. cp .env.deploy.example .env   # then set RELAY_DOMAIN + JWT_SECRET
#   3. docker compose up -d --build
#   4. curl https://$RELAY_DOMAIN/health   →   {"ok":true,"name":"marudesk-relay"}
#
# Caddy gets a Let's Encrypt cert for $RELAY_DOMAIN automatically and reverse-
# proxies both the auth HTTP API and the WebSocket upgrade (wss://$RELAY_DOMAIN/
# connect) to the relay. The relay itself never sees TLS — it's plain HTTP on the
# internal network.
services:
  relay:
    build: .
    restart: unless-stopped
    # JWT_SECRET, CORS_ORIGINS, OAUTH_REDIRECT_BASE and any OAuth creds come from .env.
    env_file: .env
    environment:
      # Pinned here so .env can't accidentally weaken the production posture.
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8788"
      DATA_DIR: /data
    volumes:
      - relay-data:/data
    expose:
      - "8788" # internal only; Caddy is the public edge

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80" # ACME HTTP challenge + redirect to HTTPS
      - "443:443"
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # persisted certs — keep this volume
      - caddy-config:/config
    depends_on:
      - relay

volumes:
  relay-data:
  caddy-data:
  caddy-config:
