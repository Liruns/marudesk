<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>marudesk</title>
    <!-- Pre-paint theme guard: set data-theme before the bundle loads so a
         light-theme user never sees a dark first frame. Mirrors the mode the
         settings store caches in localStorage; falls back to the OS preference. -->
    <script>
      try {
        var m = localStorage.getItem('marudesk.theme');
        if (
          m === 'light' ||
          ((!m || m === 'system') &&
            window.matchMedia('(prefers-color-scheme: light)').matches)
        ) {
          document.documentElement.dataset.theme = 'light';
        }
      } catch (e) {
        /* best-effort */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
